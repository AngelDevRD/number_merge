name: number_merge
description: "Number Merge - juego de puzzle numerico estilo 2048."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0
  package_info_plus: ^8.0.0
  http: ^1.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#9A93BC"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21
